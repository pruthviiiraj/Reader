<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Readalong">
<meta name="description" content="Reads articles, PDFs and notes aloud in a natural voice while highlighting each word.">
<title>Readalong</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,650;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>

<!-- Library -->
<main id="library" class="lib">
  <div class="lib-inner">
    <div class="lib-top">
      <div class="wordmark"><img src="icons/icon.svg" alt="">Readalong</div>
      <button class="icon-btn" id="openSettings" aria-label="Settings and shortcuts">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>

    <h1 class="large-title">Library</h1>

    <form class="linkbar" id="linkForm" autocomplete="off">
      <svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      <input id="linkInput" type="url" inputmode="url" placeholder="Paste a link to an article or PDF" aria-label="Web link">
      <button type="button" class="btn" id="pasteLinkBtn">Paste</button>
      <button type="submit" class="btn primary">Read</button>
    </form>

    <div class="add-row">
      <button class="tile" id="addFile">
        <svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        <b>Open file</b><small>PDF, Word, Markdown, text</small>
      </button>
      <button class="tile desktop-only" id="addFolder">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <b>Open folder</b><small>Your Obsidian vault</small>
      </button>
      <button class="tile" id="addText">
        <svg class="i" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2M8 12h8M8 16h5"/></svg>
        <b>Paste text</b><small>From an email, chat, anywhere</small>
      </button>
    </div>

    <section class="vault" id="vault" hidden>
      <div class="vault-head"><b id="vaultName"></b><span id="vaultCount"></span>
        <input id="vaultFilter" placeholder="Filter notes" aria-label="Filter notes">
        <button class="icon-btn" id="vaultClose" aria-label="Close folder"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="vault-list" id="vaultList"></div>
    </section>

    <div id="resume"></div>

    <div class="section-head"><h2>Documents</h2><span id="docCount"></span></div>
    <ul class="doc-list" id="docList"></ul>
    <div class="empty" id="libEmpty" hidden>
      <b>Nothing here yet</b>
      Open a file, paste a link, or drop a document anywhere on this window.
    </div>

    <div class="voice-status" id="voiceStatus"><span class="dot"></span><span id="voiceStatusText">Preparing voice</span></div>
  </div>
</main>

<!-- Reader -->
<section id="reader" hidden>
  <header class="r-head">
    <div class="r-head-row">
      <button class="back" id="backBtn" aria-label="Back to library">
        <svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>Library</span>
      </button>
      <div class="r-title" id="rTitle"></div>
      <div class="r-actions">
        <button class="icon-btn" id="tocBtn" aria-label="Sections and skipping">
          <svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        </button>
        <button class="icon-btn" id="displayBtn" aria-label="Text and display">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 19 9 5l5 14M5.8 14h6.4M15 19l3-8 3 8M15.9 16.5h4.2"/></svg>
        </button>
      </div>
    </div>
    <div class="r-progress"><i id="rProgress"></i></div>
  </header>

  <article class="text" id="text" aria-live="off"></article>

  <button class="pill" id="returnPill" hidden>
    <svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Back to where we're reading
  </button>
  <button class="pill dark" id="selPill" hidden>
    <svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;stroke:none"><path d="M7 4v16l13-8z"/></svg>Read selection
  </button>

  <div class="player" id="player">
    <div class="scrub" id="scrub" role="slider" aria-label="Position in document" tabindex="0"><div class="scrub-track"><i id="scrubFill"></i></div></div>
    <div class="p-row">
      <button class="p-chip" id="speedBtn" aria-label="Speed">1.0×</button>
      <div class="p-center">
        <button class="skip-btn" id="prevBtn" aria-label="Previous sentence">
          <svg class="i" viewBox="0 0 24 24"><path d="M11 18 5 12l6-6M19 18l-6-6 6-6"/></svg>
        </button>
        <button class="play" id="playBtn" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
        <button class="skip-btn" id="nextBtn" aria-label="Next sentence">
          <svg class="i" viewBox="0 0 24 24"><path d="m13 6 6 6-6 6M5 6l6 6-6 6"/></svg>
        </button>
      </div>
      <button class="p-chip right" id="voiceBtn" aria-label="Voice">
        <svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg><span id="voiceName">Heart</span>
      </button>
    </div>
    <div class="p-meta"><span id="pStatus"></span><span id="pLeft"></span></div>
  </div>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="busy" id="busy" hidden><div id="busyText">Loading</div></div>
<div class="drop-hint" id="dropHint" hidden>Drop to start reading</div>
<input type="file" id="fileIn" accept=".pdf,.docx,.md,.markdown,.txt,.text,.html,.htm,application/pdf,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<input type="file" id="folderIn" webkitdirectory multiple hidden>
</body>
</html>
